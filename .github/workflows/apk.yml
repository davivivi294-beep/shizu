name: APK
on: workflow_dispatch
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Copiar a interface para o app
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html manifest.json icone-192.png icone-512.png android/app/src/main/assets/
      - name: Compilar
        run: gradle -p android assembleDebug --no-daemon
      - name: Publicar o APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk shizu.apk
          gh release create "apk-${{ github.run_number }}" shizu.apk --title "Shizu ${{ github.run_number }}" --notes "APK da Shizu" --latest
